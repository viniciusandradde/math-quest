______</text><path d="M48 1000H746" stroke="#d7e2ee" stroke-width="2"/><text x="48" y="1040" font-size="15" fill="#52657a">Dica: experimente girar a matriz. O número de linhas e colunas muda, mas o total pode continuar igual.</text><text x="746" y="1080" font-size="14" text-anchor="end" fill="#168bea">MATH QUEST • 02</text></g></svg>
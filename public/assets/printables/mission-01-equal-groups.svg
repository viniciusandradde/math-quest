<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="#fff"/><g font-family="Arial,sans-serif" fill="#071426"><text x="48" y="60" font-size="18" font-weight="bold" fill="#168bea">MATH QUEST • CADERNO DE MISSÕES</text><text x="48" y="118" font-size="34" font-weight="bold">Missão 01 — Grupos iguais</text><text x="48" y="158" font-size="18">Nome: __________________________________  Data: ____ / ____ / ______</text><path d="M48 180H746" stroke="#168bea" stroke-width="4"/><text x="48" y="226" font-size="22" font-weight="bold">1. Observe os grupos</text><text x="48" y="260" font-size="17">Desenhe 4 grupos com 3 estrelas em cada grupo.</text><g fill="none" stroke="#9bb1c8" stroke-width="2"><rect x="48" y="285" width="150" height="150" rx="14"/><rect x="220" y="285" width="150" height="150" rx="14"/><rect x="392" y="285" width="150" height="150" rx="14"/><rect x="564" y="285" width="150" height="150" rx="14"/></g><text x="48" y="485" font-size="22" font-weight="bold">2. Complete a ideia</text><text x="48" y="526" font-size="19">Temos ______ grupos com ______ elementos em cada grupo.</text><text x="48" y="575" font-size="19">Adição repetida: ______ + ______ + ______ + ______ = ______</text><text x="48" y="624" font-size="19">Multiplicação: ______ × ______ = ______</text><path d="M48 660H746" stroke="#d7e2ee" stroke-width="2"/><text x="48" y="710" font-size="22" font-weight="bold">3. Agora é sua vez</text><text x="48" y="748" font-size="17">Crie uma situação com 3 grupos de 5 objetos. Desenhe e escreva a conta.</text><rect x="48" y="775" width="698" height="210" rx="14" fill="none" stroke="#9bb1c8" stroke-width="2" stroke-dasharray="8 6"/><text x="48" y="1035" font-size="15" fill="#52657a">Dica: conte os grupos primeiro. Depois, descubra quantos elementos há em cada grupo.</text><text x="746" y="1080" font-size="14" text-anchor="end" fill="#168bea">MATH QUEST • 01</text></g></svg>
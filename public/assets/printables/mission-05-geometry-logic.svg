<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="#fff"/><g font-family="Arial,sans-serif" fill="#071426"><text x="42" y="48" font-size="17" font-weight="bold" fill="#168bea">MATH QUEST • OPERAÇÃO RESGATE</text><text x="42" y="92" font-size="29" font-weight="bold">Geometria e lógica</text><text x="42" y="123" font-size="15">Nome: _______________________________ Data: ____/____/______</text><path d="M42 145H752" stroke="#168bea" stroke-width="4"/><text x="42" y="190" font-size="20" font-weight="bold">MISSÃO 4 — Plataforma de pouso</text><text x="42" y="222" font-size="16">A plataforma retangular mede 18 m de comprimento e 7 m de largura.</text><text x="42" y="250" font-size="17" font-weight="bold">a) Qual é a área? b) Quantos metros de cerca são necessários?</text><g fill="none" stroke="#168bea" stroke-width="3"><rect x="180" y="280" width="360" height="140" rx="5"/><path d="M180 435H540M555 280V420"/></g><text x="360" y="450" font-size="14" text-anchor="middle">18 m</text><text x="565" y="355" font-size="14">7 m</text><rect x="42" y="470" width="710" height="90" rx="10" fill="none" stroke="#9bb1c8" stroke-width="2" stroke-dasharray="7 5"/><text x="42" y="610" font-size="20" font-weight="bold">MISSÃO 5 — Código da sequência</text><text x="42" y="644" font-size="17">5 • 11 • 23 • 47 • 95 • ______</text><text x="42" y="680" font-size="16">Descubra a regra e escreva como chegou ao próximo número.</text><rect x="42" y="700" width="710" height="90" rx="10" fill="none" stroke="#9bb1c8" stroke-width="2" stroke-dasharray="7 5"/><text x="42" y="840" font-size="20" font-weight="bold">MISSÃO 6 — Distribuição de suprimentos</text><text x="42" y="872" font-size="16">A estação recebeu 60 unidades de oxigênio e 40 de água.</text><text x="42" y="899" font-size="16">Usou 2/5 do oxigênio e 3/4 da água.</text><text x="42" y="927" font-size="17" font-weight="bold">Quantas unidades foram usadas ao todo?</text><rect x="42" y="946" width="710" height="100" rx="10" fill="none" stroke="#9bb1c8" stroke-width="2" stroke-dasharray="7 5"/><text x="42" y="1080" font-size="13" text-anchor="end" fill="#168bea">MATH QUEST • FOLHA 2/2</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="#fff"/><g font-family="Arial,sans-serif" fill="#071426"><text x="48" y="60" font-size="18" font-weight="bold" fill="#168bea">MATH QUEST • CADERNO DE MISSÕES</text><text x="48" y="118" font-size="34" font-weight="bold">Missão 03 — Problemas de aventura</text><text x="48" y="158" font-size="18">Nome: __________________________________  Data: ____ / ____ / ______</text><path d="M48 180H746" stroke="#168bea" stroke-width="4"/><text x="48" y="235" font-size="22" font-weight="bold">1. Energia para os robôs</text><text x="48" y="275" font-size="18">Há 5 robôs. Cada um precisa de 4 baterias.</text><text x="48" y="315" font-size="18">Quantas baterias são necessárias ao todo?</text><text x="48" y="365" font-size="18">Desenho / estratégia:</text><rect x="48" y="385" width="698" height="145" rx="14" fill="none" stroke="#9bb1c8" stroke-width="2" stroke-dasharray="8 6"/><text x="48" y="570" font-size="18">Conta: __________________________  Resposta: __________________</text><text x="48" y="635" font-size="22" font-weight="bold">2. Moedas da missão</text><text x="48" y="675" font-size="18">Uma equipe encontrou 6 baús. Em cada baú há 3 moedas.</text><text x="48" y="715" font-size="18">Quantas moedas a equipe encontrou?</text><text x="48" y="765" font-size="18">Conta: __________________________  Resposta: __________________</text><path d="M48 805H746" stroke="#d7e2ee" stroke-width="2"/><text x="48" y="855" font-size="22" font-weight="bold">3. Crie seu próprio desafio</text><text x="48" y="895" font-size="18">Escreva uma história que possa ser resolvida com multiplicação.</text><rect x="48" y="915" width="698" height="120" rx="14" fill="none" stroke="#9bb1c8" stroke-width="2" stroke-dasharray="8 6"/><text x="48" y="1070" font-size="15" fill="#52657a">Dica: explique como pensou. Existem diferentes estratégias para chegar ao resultado.</text><text x="746" y="1100" font-size="14" text-anchor="end" fill="#168bea">MATH QUEST • 03</text></g></svg>